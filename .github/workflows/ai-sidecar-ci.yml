# EdgeLite AI Sidecar CI/CD Pipeline
name: AI Sidecar CI

on:
  push:
    paths:
      - 'ai_sidecar/**'
      - '.github/workflows/ai-sidecar-ci.yml'
  pull_request:
    paths:
      - 'ai_sidecar/**'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_sidecar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Flake8 lint
        run: flake8 server.py tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: MyPy type check
        run: mypy server.py --ignore-missing-imports || true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_sidecar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short --cov=server --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ai_sidecar/coverage.xml
          fail_ci_if_error: false

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Sidecar Docker image
        working-directory: .
        run: |
          docker build -f docker/Dockerfile.sidecar -t edgelite-ai-sidecar:ci .
          docker run --rm -d --name sidecar-test -p 50052:50052 edgelite-ai-sidecar:ci
          # Wait for startup (onnxruntime import is slow on cold runners)
          ok=""
          for i in $(seq 1 45); do
            if curl -sf http://localhost:50052/health | grep -q '"healthy": *true'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::Sidecar health check failed"
            docker logs sidecar-test || true
            exit 1
          fi
          docker stop sidecar-test
