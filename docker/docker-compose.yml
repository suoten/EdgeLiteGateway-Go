services:
  edgelite:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: edgelite-gateway-go
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - edgelite-data:/app/data
      - ../configs:/app/configs:ro
      - ../logs:/app/data/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - EDGELITE_INFLUXDB__URL=http://influxdb:8086
      - EDGELITE_INFLUXDB__TOKEN=${INFLUXDB_TOKEN:-}
      - EDGELITE_MQTT__BROKER=mosquitto
      - EDGELITE_MQTT__USERNAME=edgelite
      - EDGELITE_MQTT__PASSWORD=${MQTT_PASSWORD:-}
      - EDGELITE_SECURITY__SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in docker/.env}
      - EDGELITE_SERVER__HOST=0.0.0.0
      - EDGELITE_SERVER__PORT=8080
      - EDGELITE_SERVER__CORS_ALLOWED_ORIGINS=http://localhost:8080;http://localhost:3000
      - EDGELITE_FRONTEND_DIST=/app/web/dist
      - EDGELITE_AI_INFERENCE__SIDECAR_URL=http://ai-sidecar:50052
      - EDGELITE_AI_INFERENCE__ENABLED=true
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      ai-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"
    networks:
      - edgelite-net

  # ── AI Sidecar: Python ONNX inference HTTP API ────────────────────
  ai-sidecar:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sidecar
    container_name: edgelite-ai-sidecar-go
    ports:
      - "127.0.0.1:50052:50052"
    volumes:
      - ai-models:/app/models
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - AI_SIDECAR_HOST=0.0.0.0
      - AI_SIDECAR_PORT=50052
      - AI_MODELS_DIR=/app/models
      - AI_SIDECAR_LOG_LEVEL=INFO
      - AI_SIDECAR_JSON_LOGS=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50052/health/live')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "2.0"
    networks:
      - edgelite-net

  influxdb:
    image: influxdb:2.7-alpine
    container_name: edgelite-influxdb-go
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-edgelite}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD must be set in docker/.env}
      - DOCKER_INFLUXDB_INIT_ORG=edgelite
      - DOCKER_INFLUXDB_INIT_BUCKET=edgelite
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"
    networks:
      - edgelite-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edgelite-mosquitto-go
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    tmpfs:
      - /mosquitto/passwd
    environment:
      - MQTT_PASSWORD=${MQTT_PASSWORD:?MQTT_PASSWORD must be set in docker/.env}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        mkdir -p /mosquitto/passwd && touch /mosquitto/passwd/passwd &&
        mosquitto_passwd -b /mosquitto/passwd/passwd edgelite "$${MQTT_PASSWORD}" &&
        chmod 0700 /mosquitto/passwd/passwd &&
        chown mosquitto:mosquitto /mosquitto/passwd/passwd;
        exec /docker-entrypoint.sh mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"
    networks:
      - edgelite-net

  # ── Monitoring: Prometheus metrics scraper ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: edgelite-prometheus-go
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - edgelite-net

  # ── Monitoring: Grafana visualization dashboard ─────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: edgelite-grafana-go
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in docker/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    networks:
      - edgelite-net

volumes:
  edgelite-data:
  influxdb-data:
  mosquitto-data:
  prometheus-data:
  grafana-data:
  ai-models:

networks:
  edgelite-net:
    driver: bridge
