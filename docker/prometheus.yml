global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Go Gateway metrics
  - job_name: 'edgelite-gateway'
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['edgelite:8080']
    scrape_interval: 10s

  # AI Sidecar metrics
  - job_name: 'edgelite-ai-sidecar'
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-sidecar:50052']
    scrape_interval: 10s
