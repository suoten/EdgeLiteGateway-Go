# Development docker-compose: Go backend only, no frontend build
# Usage: docker compose -f docker-compose.dev.yml up
services:
  edgelite-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: edgelite-gateway-go-dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - edgelite-dev-data:/app/data
      - ../configs:/app/configs:ro
    environment:
      - DEV_MODE=true
      - EDGELITE_SECURITY__SECRET_KEY=dev-mode-auto-generated-secret-key-32chars
      - EDGELITE_SERVER__HOST=0.0.0.0
      - EDGELITE_SERVER__PORT=8080
      - EDGELITE_SERVER__CORS_ALLOWED_ORIGINS=http://localhost:5173;http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - edgelite-dev-net

volumes:
  edgelite-dev-data:

networks:
  edgelite-dev-net:
    driver: bridge
