apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgelite.fullname" . }}
  labels:
    {{- include "edgelite.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "edgelite.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "edgelite.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-db-dir
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/logs /data/backups && chown -R 1000:1000 /data']
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          env:
            - name: EDGELITE_SECURITY__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "edgelite.fullname" . }}-secret
                  key: secret_key
            - name: EDGELITE_SECURITY__CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "edgelite.fullname" . }}-secret
                  key: csrf_secret
            - name: EDGELITE_SERVER__HOST
              value: {{ .Values.gateway.host | quote }}
            - name: EDGELITE_SERVER__PORT
              value: {{ .Values.gateway.port | quote }}
            - name: EDGELITE_LOGGING__LEVEL
              value: {{ .Values.gateway.logging.level | quote }}
            - name: EDGELITE_LOGGING__JSON_FORMAT
              value: {{ .Values.gateway.logging.jsonFormat | quote }}
            {{- if .Values.gateway.influxdb.url }}
            - name: EDGELITE_INFLUXDB__URL
              value: {{ .Values.gateway.influxdb.url | quote }}
            {{- end }}
            {{- if .Values.gateway.mqtt.broker }}
            - name: EDGELITE_MQTT__BROKER
              value: {{ .Values.gateway.mqtt.broker | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "edgelite.fullname" . }}-config
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.existingClaim }}{{ .Values.persistence.existingClaim }}{{ else }}{{ include "edgelite.fullname" . }}-data{{ end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: config
          configMap:
            name: {{ include "edgelite.fullname" . }}-config
            optional: true
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
