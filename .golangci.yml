version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
linters:
  enable:
    - misspell
    - revive
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
        - name: var-naming
    staticcheck:
      # Match the v1 linter set: stylecheck (ST*) was not enabled and QF* are
      # optional "quickfix" refactor suggestions that staticcheck's own CLI
      # does not enable by default.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - revive
        path: _test\.go
      - linters:
          - revive
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - edgelite
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
